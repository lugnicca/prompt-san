[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptsan"
version = "1.0.0"
description = "Minimal yet powerful text anonymization library"
authors = [{name = "Lugnicca", email = "lugnicca@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Security",
]
keywords = ["anonymization", "privacy", "nlp", "text-processing", "llm"]
dependencies = [
    "pydantic>=2.0.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.5",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
cli = [
    "click>=8.0.0",
]

[project.scripts]
promptsan = "promptsan.cli:main"

[project.urls]
Homepage = "https://github.com/lugnicca/prompt-san"
Documentation = "https://github.com/lugnicca/prompt-san#readme"
Repository = "https://github.com/lugnicca/prompt-san"
"Bug Tracker" = "https://github.com/lugnicca/prompt-san/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptsan*"]

[tool.setuptools.package-data]
promptsan = ["*.txt", "*.json", "examples/*.py", "examples/*.json"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true